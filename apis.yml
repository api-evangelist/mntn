apis:
- name: MNTN Performance TV (PTV) API
  description: >-
    OpenAPI 3.1 platform API for MNTN Performance TV. Covers advertisers and organizations, campaign
    and flight lifecycle (create, update, launch, pause, archive), creatives, audiences including geo
    lists, keyword and location search and recommended audiences, conversion pixel configuration,
    GA4 id storage, pixel health/verification tooling, attribution windows, sales cycle and estimates,
    private marketplace partners, deals, deal groups and channels, reference vocabularies (budget
    types and goals, campaign objectives and statuses, geo types, audience segment types), and
    reporting including asynchronous batch exports. 85 operations across 61 paths and 15 tags.
  humanURL: https://api.mountain.com/docs

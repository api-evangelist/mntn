  - type: Overlay
    url: overlays/mntn-reporting-overlay.yaml
- name: MNTN Async Batch Export API
  description: >-
    Asynchronous CSV export API under /batch on api3.mountain.com, for reporting queries too large or
    slow to run synchronously (a 413 on /apidata is the documented trigger). POST /batch enqueues a job
    and returns 202 with a batchId; GET /batch/{batchId} polls status and returns a fresh time-limited
    signed download URL when the job SUCCEEDED; POST /batch/{batchId}/regenerate-url reissues a signed
    URL without re-running the query; GET /batch lists recent jobs with status, limit and offset paging.
    Gated behind the r2ds.exports.enabled entitlement.
  humanURL: https://api3.mountain.com/docs
  baseURL: https://api3.mountain.com
  tags:
  - marketing-reporting
  - bulk-data
  - analytics
  properties:
  - type: APIReference
    url: https://api3.mountain.com/docs
  - type: OpenAPI
    url: openapi/mntn-batch-export-openapi.yml
  - type: Overlay
    url: overlays/mntn-batch-overlay.yaml

aid: mntn
name: MNTN
description: >-
  MNTN (mountain.com) is a Connected TV performance marketing platform that lets brands plan, launch,
  target, measure, and optimize outcome-based TV advertising across streaming inventory. Its programmable
  surface is two distinct HTTP APIs: the Performance TV (PTV) platform API at api.mountain.com, an
  OpenAPI 3.1 contract covering advertisers, organizations, campaigns, flights, creatives, audiences and
  geo-lists, conversion pixel setup and verification, attribution windows and estimates, private
  marketplace (PMP) partners/deals/deal-groups/channels, reference vocabularies, and reporting; and the
  Reporting API 3.0 at api3.mountain.com, a partner reporting surface (/apilist metadata, /apidata query
  execution) plus an asynchronous /batch CSV export API that returns time-limited signed download URLs.
  Both are documented with published OpenAPI definitions rendered through Scalar. Authentication is an
  MNTN-issued advertiser API key (X-API-Key header on the platform API, key query parameter on the
  reporting API) or a bearer JWT. Errors are RFC 9457 problem+json with traceId and errorCode.

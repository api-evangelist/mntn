- name: MNTN Reporting API 3.0
  description: >-
    Public partner reporting surface at api3.mountain.com. GET /apilist returns the tables and columns
    available to the authenticated advertiser; GET and POST /apidata execute multidimensional queries
    over Info (dimension) and Summary (metric) tables joined on shared keys, with JSON-encoded filter
    syntax, fully qualified column identifiers such as campaigninfo.name and graph.impressions, and
    json, csv, human and Excel output formats. Authenticated with the advertiser API key as a key query
    parameter. API 3.0 defaults to First Touch attribution; API 1.0 stopped returning data 2026-04-01.
  humanURL: https://api3.mountain.com/docs
  baseURL: https://api3.mountain.com
  tags:
  - marketing-reporting
  - analytics
  - connected-tv
  - attribution
  properties:

key_issuance:
  self_service: true
  where: MNTN platform UI, My Account / Account Settings -> API tab
  docs: https://help.mountain.com/en/articles/6511970-access-your-reporting-api-key
  note: >-
    MNTN issues one advertiser-scoped Reporting API key per account from the platform UI. The help
    center instructs customers to "treat it like a password and only share it with platforms you
    trust" -- there is no published key rotation, expiry, or scoping model, and no OAuth 2.0 or
    OpenID Connect surface is documented on any MNTN host.
surfaces:
- api: MNTN Performance TV (PTV) API
  host: https://api.mountain.com
  accepted:
  - {scheme: Bearer, transport: 'Authorization: Bearer <JWT>', format: JWT}
  - {scheme: API Key, transport: 'X-API-Key: <key>', format: opaque}
  unauthenticated_behavior:
    status: 401
    body: '{"error":"Authentication required"}'
    content_type: application/json
    note: >-
      The api.mountain.com gateway (istio-envoy) answers 401 for every path except /openapi.json,
      /openapi.yaml and /docs, which are served anonymously.
- api: MNTN Reporting API 3.0 and Async Batch Export API
  host: https://api3.mountain.com
  accepted:
  - {scheme: API Key, transport: 'key=<key> query parameter', format: opaque}
  unauthenticated_behavior:
    status: 401
    body: RFC 9457 application/problem+json
  note: >-
    The reporting API carries the credential in the URL query string, which leaks the key into proxy
    logs, browser history, and referrer headers. A header-borne alternative is not documented.
oauth2: false
openid_connect: false

  title: API 3.0 Reporting Enhancements
  type: api
  breaking: true
  highlight: >-
    Multidimensional querying, simplified API definitions, First Touch reporting by default, and full
    data parity including Audience Segment Data. Announced with the API 1.0 sunset date of 2026-04-01.
  breaking_changes:

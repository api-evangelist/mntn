    TV API at api.mountain.com does NOT conform -- it returns an ad-hoc {"error": string} body.
- id: rfc9110
  name: HTTP Semantics
  conforms: true
  partial: true
  evidence: >-
    Correct use of 200/201/202/204 and 400/401/403/404/409/410/413/429/500/503/504 on the reporting
    and batch surfaces, including a semantically correct 202 Accepted plus poll pattern for async
    exports and 410 Gone for expired results. The PTV API declares only a bare `default` response on
    78 of 85 operations, which is a weaker use of the status vocabulary.

reference_vocabularies:
  note: >-
    Six reference endpoints publish the controlled vocabularies the write operations validate against.
    This is a genuine strength -- an agent can enumerate legal values rather than guess them.
  endpoints:
  - {operation: reference.listBudgetTypes, path: /api/v1/reference/budget/types}
  - {operation: reference.listGoalTypes, path: /api/v1/reference/budget/goals}
  - {operation: reference.listCampaignObjectives, path: /api/v1/reference/campaign/objectives}
  - {operation: reference.listCampaignStatuses, path: /api/v1/reference/campaign/statuses}
  - {operation: reference.listGeoTypes, path: /api/v1/reference/geo/types}
  - {operation: reference.listAudienceSegmentTypes, path: /api/v1/reference/audience/segment-types}
reporting_model:
  source: 'openapi/_original/mntn-reporting-api-openapi.json info.description'
  shape: >-
    A separate star-schema query model, not the resource graph above. Info tables carry dimensions,
    Summary tables carry metrics, joined on shared keys, addressed with fully qualified identifiers
    such as campaigninfo.name and graph.impressions. GET /apilist enumerates the tables and columns
    available to the authenticated advertiser -- the reporting equivalent of a reference vocabulary.
gaps:
- No schema-level $ref links between entities, so relationship discovery requires reading URL structure.
- No id prefix scheme and no published object-reference page, so ids are not self-describing.
- Organizations expose no GET; a caller cannot read the tenancy root it is writing to.

note: >-
  Derived from the Performance TV OpenAPI. MNTN's spec carries almost no $ref links between entity
  schemas -- relationships are expressed through the URL hierarchy and through id-reference fields on
  request bodies (orgId, advertiserId, audienceIds, channelId, partnerId, dealGroupId, pmpDealId,
  geoListId, campaignId, flight_id). The graph below is read from those two signals, not invented.
id_conventions:
  style: 'opaque path ids; organizations use a distinct publicOrgId, flights use snake_case flight_id'
  inconsistency: >-
    Identifier parameter naming is inconsistent across the surface -- {id}, {advertiserId},
    {campaignId}, {publicOrgId}, {pmpDealId}, {dealGroupId}, {partnerId}, {geoListId} and
    {flight_id} all appear, with flight_id the only snake_case path parameter in 61 paths.
  prefixes_published: false

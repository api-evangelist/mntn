envelope:
  schema: ProblemDetail
  title: Problem Detail (RFC 9457)
  fields:
  - {name: type, type: string, description: URI reference identifying the problem type, example: 'https://api3.mountain.com/problems/not-found'}
  - {name: title, type: string, description: Short human-readable summary, stable across occurrences}
  - {name: status, type: integer, description: HTTP status code}
  - {name: detail, type: string, description: Human-readable explanation specific to this occurrence}
  - {name: instance, type: string, description: URI reference identifying the specific occurrence (request path)}
  - {name: timestamp, type: string, description: ISO 8601 timestamp when the error occurred}
  - {name: errorCode, type: string, description: Internal error code for support reference, example: QUERY_TIMEOUT}
  - {name: traceId, type: string, description: OpenTelemetry trace ID for debugging and support}
  - {name: errors, type: array, description: 'Field-level validation errors on 400 Bad Request (field, message)'}
  note: >-
    The reporting and batch APIs return a genuine RFC 9457 document with the full member set plus three
    useful extensions -- timestamp, errorCode and an OpenTelemetry traceId that a caller can quote to
    support. This is above the norm for adtech reporting APIs.

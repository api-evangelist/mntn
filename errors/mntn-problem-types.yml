ptv_api:
  note: >-
    The Performance TV API at api.mountain.com is markedly weaker on error semantics than the reporting
    API. Of its 85 operations, 78 declare only a bare `default` response of application/json and just
    two operations each declare 400, 401 or 404. No problem+json media type, no error schema, and no
    error registry is published for that surface.
  declared_status_codes: {'200': 53, '201': 5, '202': 1, '204': 7, '400': 2, '401': 2, '404': 2, default: 78}
  observed:
  - {request: 'GET https://api.mountain.com/', status: 401, body: '{"error":"Authentication required"}', format: 'ad-hoc, not RFC 9457'}
gaps:
- No published error-code registry enumerating errorCode values; QUERY_TIMEOUT is the only one named anywhere.
- The two API families use two different error formats (RFC 9457 on api3, a bare {"error": string} on api).
- No 429 or Retry-After semantics on the synchronous reporting surface.

  reference_tools_note: >-
    The six reference endpoints (budget types and goals, campaign objectives and statuses, geo types,
    audience segment types) are better exposed as MCP resources than tools -- they are static
    controlled vocabularies an agent should read once per session.
  agent_safety_note: >-
    Nine of the twenty candidate tools mutate state and three of them move money (create_campaign,
    launch_campaign, and the budget fields on update_campaign). None of the backing operations
    supports an idempotency key, so a retried tool call can double-launch. Any real MNTN MCP server
    would need to add idempotency before exposing the write path to an agent.
crosswalk:
  emitted: false
  reason: >-
    mcp/<slug>-tool-crosswalk.yml is emitted only when the provider ships an MCP server or a GraphQL
    endpoint alongside the OpenAPI. MNTN ships neither, so there is nothing to bind the OpenAPI
    operations to -- a crosswalk here would be a crosswalk against tools we invented.

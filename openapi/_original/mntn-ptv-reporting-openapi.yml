      properties:
        data:
          type: object
          properties:
            tables:
              type: array
              items:
                type: object
                properties:
                  table:
                    type: string
                  type:
                    type: string
                  friendly:
                    type: string
                  exclude-list:
                    type: array
                    items:
                      type: string
                  columns:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        friendly:
                          type: string
                        format:
                          type: string
                        help:
                          type: string
                        hide:
                          type: boolean
                        icon:
                          type: string
                        friendly-suffix:
                          type: string
                        period:
                          type: string
                        target_direction_negative:
                          type: boolean
                        compatible-dimensions:
                          type: array
                          items:
                            type: string
                        column_filters:
                          type: array
                          items:
                            type: string
                        tags:
                          type: array
                          items:
                            type: string
                      required:
                      - name
                      - friendly
                      - format
                      - help
                      - hide
                      - icon
                      - friendly-suffix
                      - column_filters
                      additionalProperties: false
                required:
                - table
                - type
                - friendly
                - columns
                additionalProperties: false
          required:
          - tables
          additionalProperties: false
      required:
      - data
      additionalProperties: false
    BatchExportStatusSingleResponseDto_Output:
      type: object
      properties:
        data:
          type: object
          properties:
            batchId:
              type: number
              description: Batch identifier.
            status:
              type: string
              description: Current status, e.g. `QUEUED`, `PROCESSING`, `SUCCEEDED`, `FAILED`.
            submittedAt:
              description: Timestamp the job was queued (ISO-8601).
              type: string
            reportName:
              description: Optional report name.
              type: string
            requestParams:
              description: 'Snapshot of the original request body as parsed JSON. When chapi returns a stringified body, papi
                parses it; if parsing fails the raw string is wrapped as `{ raw: <string> }`.'
              type: object
              additionalProperties: {}
            startedAt:
              description: Timestamp the job started executing (ISO-8601).
              type: string
            completedAt:
              description: Timestamp the job finished (ISO-8601).
              type: string
            downloadUrl:
              description: Time-limited signed URL for the result file. Regenerated on every read; clients must not treat
                it as stable.
              type: string
            downloadExpiresAt:
              description: Timestamp when `downloadUrl` expires (ISO-8601).
              type: string
            error:
              description: Error details when `status` is `FAILED`.
              type: object
              properties:
                code:
                  description: Upstream error code.
                  type: string
                message:
                  description: Human-readable error message.
                  type: string
                retryable:
                  description: Whether the failure is retryable.
                  type: boolean
              additionalProperties: false
          required:
          - batchId
          - status
          additionalProperties: false
      required:
      - data
      additionalProperties: false

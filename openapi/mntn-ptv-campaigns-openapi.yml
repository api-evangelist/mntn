  /api/v1/campaigns/{id}/pause:
    post:
      description: 'Pauses a live campaign so it stops delivering.


        **Notes:** Only a live campaign can be paused. An optional `pause_reason` records why the campaign was paused. The
        paused campaign is returned so the caller can confirm the new status.'
      operationId: campaigns.pause
      parameters:
      - name: id
        required: true
        in: path
        description: Campaign (campaign group) ID.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseCampaignBodyDto'
      responses:

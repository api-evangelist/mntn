openapi: 3.1.0
info:
  title: PTV API - campaigns
  description: PTV API authoritative source of truth for PTV data.
  version: '1.0'
  contact:
    name: MNTN Platform
    url: https://api.mountain.com
    email: support@mountain.com
  license:
    name: Proprietary
servers:
- url: https://api.mountain.com/ptv
  description: MNTN Performance TV API gateway
tags:
- name: campaigns
  description: Campaign list, lookup, and lifecycle.
paths:
  /api/v1/campaigns:
    get:
      description: 'Returns campaigns the caller is authorized to see, filtered by advertiser, campaign, status, objective,
        or search text.


        **Filters:** `advertiserId`, `campaignId` (repeatable), `objective`, `search`, `status` (repeatable).


        **Sorting:** `sortBy` (`name`, `status`, `objective`, `totalBudget`, `monthlyBudget`, `spend`, `startTime`, `endTime`,
        `createdAt`, `updatedAt`) with `sortOrder` (`asc`/`desc`, default `asc`).


        **Notes:** Each campaign carries `creativeIds` for its attached creatives; fetch a single campaign with `expand=creatives`
        for click URLs and weights.'
      operationId: campaigns.list
      parameters:
      - name: page
        required: false
        in: query
        description: 1-based page number.
        schema:
          minimum: 1
          type: number
      - name: perPage
        required: false
        in: query
        description: Results per page (maximum 100).
        schema:
          minimum: 1
          maximum: 100
          type: number
      - name: status
        required: false
        in: query
        description: Repeatable campaign status filter.
        schema:
          type: array
          items:
            type: string
      - name: objective
        required: false
        in: query
        description: Campaign objective filter.
        schema:
          type: string
      - name: sortBy
        required: false
        in: query
        description: 'Field to sort by: `name`, `status`, `objective`, `totalBudget`, `monthlyBudget`, `spend`, `startTime`,
          `endTime`, `createdAt`, `updatedAt`.'
        schema:
          type: string
          enum:
          - name
          - status
          - objective
          - totalBudget
          - monthlyBudget
          - spend
          - startTime
          - endTime
          - createdAt
          - updatedAt
      - name: sortOrder
        required: false
        in: query
        description: Sort order (default `asc` when `sortBy` is set).
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: search
        required: false
        in: query
        description: Case-insensitive substring match on campaign name. Numeric values also match campaign ID and advertiser
          ID.
        schema:
          type: string
      - name: campaignId
        required: false
        in: query
        description: Repeatable campaign ID filter.
        schema:
          type: array
          items:
            type: string
      - name: advertiserId
        required: false
        in: query
        description: Advertiser ID to retrieve campaigns for.
        schema:
          exclusiveMinimum: true
          type: number
          minimum: 0
      responses:
        '200':
          description: Paginated campaign list.
          content:
            application/json:
              example:
                data:
                - id: '501'
                  name: Spring prospecting
                  status: live
                  objective: PROSPECTING
                  totalBudget: 10000
                  monthlyBudget: 2500
                  spend: 1250.5
                  startTime: '2026-01-01T00:00:00.000Z'
                  endTime: '2026-03-31T23:59:59.000Z'
                  goalType: CPA
                  goalValue: 25
                  createdAt: '2025-12-01T10:00:00.000Z'
                  updatedAt: '2026-01-15T14:30:00.000Z'
                  snapshotUrl: https://c.mountain.com/storage/video/44821/poster/poster.jpg
                  videoPreview:
                    name: Spring prospecting creative
                    videoUrl: https://c.mountain.com/storage/video/44821/video/video.mp4
                    posterUrl: https://c.mountain.com/storage/video/44821/poster/poster.jpg
                  campaignGoal: Traffic & Sales
                  advertiserId: 44
                  currentFlightId: 88001
                  audienceId: 9001
                  creativeIds:
                  - 44821
                  - 44900
                pagination:
                  total: 42
                  perPage: 25
                  page: 1
                  previousPageUrl: null
                  nextPageUrl: https://api.example.com/api/v1/campaigns?page=2&advertiserId=44
        default:
          description: Unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaignsResponseDto_Output'
      summary: List campaigns
      tags:
      - campaigns
    post:
      description: 'Creates a campaign for an advertiser with the given objective, optionally linking an existing audience,
        opening an initial budget, and attaching library creatives in the same call.


        **Notes:** Creation is a multi-step operation against the campaign provider and is not idempotent, so a client retry
        may create a duplicate. `audienceIds` accepts at most one audience; an optional `budget` opens the campaign''s first
        flight.


        **Creatives:** `creatives` attaches library creatives after the campaign is created — each entry carries the creative
        `id`, an optional `clickUrl`, and an optional serving `weight`. Explicit weights are used verbatim and creatives without
        one split the remaining share of 100 equally, so the attached set always totals 100 (launch-ready). A creative attached
        without a click-through URL cannot be approved or launched until one is set. Creatives still processing or in review
        may be attached; they serve once approved. If any creation step fails, the campaign is rolled back and its creatives
        are released — no partially-created campaign survives.'
      operationId: campaigns.create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignDto'
      responses:
        '201':
          description: Created campaign.
          content:
            application/json:
              example:
                data:
                  id: '501'
                  name: Spring prospecting
                  status: live
                  objective: PROSPECTING
                  totalBudget: 10000
                  monthlyBudget: 2500
                  spend: 1250.5
                  startTime: '2026-01-01T00:00:00.000Z'
                  endTime: '2026-03-31T23:59:59.000Z'
                  goalType: CPA
                  goalValue: 25
                  createdAt: '2025-12-01T10:00:00.000Z'
                  updatedAt: '2026-01-15T14:30:00.000Z'
                  snapshotUrl: https://c.mountain.com/storage/video/44821/poster/poster.jpg
                  videoPreview:
                    name: Spring prospecting creative
                    videoUrl: https://c.mountain.com/storage/video/44821/video/video.mp4
                    posterUrl: https://c.mountain.com/storage/video/44821/poster/poster.jpg
                  campaignGoal: Traffic & Sales
                  advertiserId: 44
                  currentFlightId: 88001
                  audienceId: 9001
                  creativeIds:
                  - 44821
                  - 44900
                  creatives:
                  - id: 44821
                    clickUrl: https://example.com/spring
                    weight: 60
                  - id: 44900
                    clickUrl: https://example.com/spring
                    weight: 40
                  currentFlight:
                    id: 88001
                    campaignGroupId: 501
                    budget: 10000
                    startTime: '2026-01-01T00:00:00.000Z'
                    endTime: '2026-03-31T23:59:59.000Z'
                    status: LIVE
                    budgetTypeId: 1
                  audience:
                    id: 9001
                    name: Holiday shoppers
                    totalUsers: 50000
                    createdAt: '2025-11-01T12:00:00.000Z'
                    geoLists: null
                    geo: null
                    updatedTime: null
                    isTest: false
        default:
          description: Unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignSingleResponseDto_Output'
      summary: Create a campaign
      tags:
      - campaigns
  /api/v1/campaigns/{id}:
    get:
      description: 'Returns the canonical campaign representation for a given campaign ID, including its primary audience
        link.


        **Notes:** Attached creative ids are always present as `creativeIds`. Pass `expand=currentFlight` for the active flight
        (Gary), `expand=audience` for the full audience record, and `expand=creatives` for the full attached-creative records
        (click URL, weight).'
      operationId: campaigns.get
      parameters:
      - name: id
        required: true
        in: path
        description: Campaign identifier.
        schema:
          type: string
      - name: expand
        required: false
        in: query
        description: 'Expand relations: `currentFlight`, `audience`, `creatives`. Use `expand=value`, repeat, or `expand[]=value`.'
        schema:
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - currentFlight
            - audience
            - creatives
      responses:
        '200':
          description: Single campaign.
          content:
            application/json:
              example:
                data:
                  id: '501'
                  name: Spring prospecting
                  status: live
                  objective: PROSPECTING
                  totalBudget: 10000
                  monthlyBudget: 2500
                  spend: 1250.5
                  startTime: '2026-01-01T00:00:00.000Z'
                  endTime: '2026-03-31T23:59:59.000Z'
                  goalType: CPA
                  goalValue: 25
                  createdAt: '2025-12-01T10:00:00.000Z'
                  updatedAt: '2026-01-15T14:30:00.000Z'
                  snapshotUrl: https://c.mountain.com/storage/video/44821/poster/poster.jpg
                  videoPreview:
                    name: Spring prospecting creative
                    videoUrl: https://c.mountain.com/storage/video/44821/video/video.mp4
                    posterUrl: https://c.mountain.com/storage/video/44821/poster/poster.jpg
                  campaignGoal: Traffic & Sales
                  advertiserId: 44
                  currentFlightId: 88001
                  audienceId: 9001
                  creativeIds:
                  - 44821
                  - 44900
                  creatives:
                  - id: 44821
                    clickUrl: https://example.com/spring
                    weight: 60
                  - id: 44900
                    clickUrl: https://example.com/spring
                    weight: 40
                  currentFlight:
                    id: 88001
                    campaignGroupId: 501
                    budget: 10000
                    startTime: '2026-01-01T00:00:00.000Z'
                    endTime: '2026-03-31T23:59:59.000Z'
                    status: LIVE
                    budgetTypeId: 1
                  audience:
                    id: 9001
                    name: Holiday shoppers
                    totalUsers: 50000
                    createdAt: '2025-11-01T12:00:00.000Z'
                    geoLists: null
                    geo: null
                    updatedTime: null
                    isTest: false
        default:
          description: Unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignSingleResponseDto_Output'
      summary: Get a campaign
      tags:
      - campaigns
    patch:
      description: 'Updates an existing campaign''s editable fields. Only the fields present in the request body are changed;
        omitted fields are left untouched.


        **Notes:** A campaign''s `objective` is immutable and any attempt to change it is rejected. `audienceIds` accepts
        at most one audience; sending an empty array clears the assigned audience.


        **Creatives:** `creatives` is the campaign''s desired full creative set — entries not yet attached are attached, attached
        creatives missing from the array are detached, and weights are applied to the survivors. Explicit weights are used
        verbatim; entries without one split the remaining share of 100 equally, so the resulting set always totals 100 (a
        weightless array means an even split, replacing any previous weights). A creative attached without a click-through
        URL cannot be approved or launched until one is set. Unlike `audienceIds`, an empty array is rejected. The reconcile
        is not atomic: additions apply one at a time (detachments and weights apply together), so a failure can leave the
        set partially updated — retrying the same request converges. If creatives are changed concurrently by another client,
        the request may fail or a concurrently-attached creative may survive; retrying resolves both.'
      operationId: campaigns.update
      parameters:
      - name: id
        required: true
        in: path
        description: Campaign (campaign group) ID.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCampaignDto'
      responses:
        '200':
          description: Updated campaign.
          content:
            application/json:
              example:
                data:
                  id: '501'
                  name: Spring prospecting
                  status: live
                  objective: PROSPECTING
                  totalBudget: 10000
                  monthlyBudget: 2500
                  spend: 1250.5
                  startTime: '2026-01-01T00:00:00.000Z'
                  endTime: '2026-03-31T23:59:59.000Z'
                  goalType: CPA
                  goalValue: 25
                  createdAt: '2025-12-01T10:00:00.000Z'
                  updatedAt: '2026-01-15T14:30:00.000Z'
                  snapshotUrl: https://c.mountain.com/storage/video/44821/poster/poster.jpg
                  videoPreview:
                    name: Spring prospecting creative
                    videoUrl: https://c.mountain.com/storage/video/44821/video/video.mp4
                    posterUrl: https://c.mountain.com/storage/video/44821/poster/poster.jpg
                  campaignGoal: Traffic & Sales
                  advertiserId: 44
                  currentFlightId: 88001
                  audienceId: 9001
                  creativeIds:
                  - 44821
                  - 44900
                  creatives:
                  - id: 44821
                    clickUrl: https://example.com/spring
                    weight: 60
                  - id: 44900
                    clickUrl: https://example.com/spring
                    weight: 40
                  currentFlight:
                    id: 88001
                    campaignGroupId: 501
                    budget: 10000
                    startTime: '2026-01-01T00:00:00.000Z'
                    endTime: '2026-03-31T23:59:59.000Z'
                    status: LIVE
                    budgetTypeId: 1
                  audience:
                    id: 9001
                    name: Holiday shoppers
                    totalUsers: 50000
                    createdAt: '2025-11-01T12:00:00.000Z'
                    geoLists: null
                    geo: null
                    updatedTime: null
                    isTest: false
        default:
          description: Unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignSingleResponseDto_Output'
      summary: Update a campaign
      tags:
      - campaigns
    delete:
      description: 'Archives a campaign so it no longer runs or appears in active listings. This is a soft delete: the campaign
        moves to the `archived` status rather than being permanently removed.


        **Notes:** Archiving a live campaign pauses it first, and the campaign''s creatives are disassociated. The archived
        campaign is returned so the caller can confirm the new status.'
      operationId: campaigns.archive
      parameters:
      - name: id
        required: true
        in: path
        description: Campaign (campaign group) ID.
        schema:
          type: string
      responses:
        '200':
          description: Archived campaign.
          content:
            application/json:
              example:
                data:
                  id: '501'
                  name: Spring prospecting
                  status: live
                  objective: PROSPECTING
                  totalBudget: 10000
                  monthlyBudget: 2500
                  spend: 1250.5
                  startTime: '2026-01-01T00:00:00.000Z'
                  endTime: '2026-03-31T23:59:59.000Z'
                  goalType: CPA
                  goalValue: 25
                  createdAt: '2025-12-01T10:00:00.000Z'
                  updatedAt: '2026-01-15T14:30:00.000Z'
                  snapshotUrl: https://c.mountain.com/storage/video/44821/poster/poster.jpg
                  videoPreview:
                    name: Spring prospecting creative
                    videoUrl: https://c.mountain.com/storage/video/44821/video/video.mp4
                    posterUrl: https://c.mountain.com/storage/video/44821/poster/poster.jpg
                  campaignGoal: Traffic & Sales
                  advertiserId: 44
                  currentFlightId: 88001
                  audienceId: 9001
                  creativeIds:
                  - 44821
                  - 44900
                  creatives:
                  - id: 44821
                    clickUrl: https://example.com/spring
                    weight: 60
                  - id: 44900
                    clickUrl: https://example.com/spring
                    weight: 40
                  currentFlight:
                    id: 88001
                    campaignGroupId: 501
                    budget: 10000
                    startTime: '2026-01-01T00:00:00.000Z'
                    endTime: '2026-03-31T23:59:59.000Z'
                    status: LIVE
                    budgetTypeId: 1
                  audience:
                    id: 9001
                    name: Holiday shoppers
                    totalUsers: 50000
                    createdAt: '2025-11-01T12:00:00.000Z'
                    geoLists: null
                    geo: null
                    updatedTime: null
                    isTest: false
        default:
          description: Unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignSingleResponseDto_Output'

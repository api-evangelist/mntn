      tags:
      - campaigns
  /api/v1/campaigns/{id}/recommended-audience:
    post:
      description: Creates a new audience for the campaign's advertiser whose keywords are derived server-side from the advertiser's
        AI-recommended keywords, and links it to the campaign. Rejects with 422 if the campaign already has an audience or
        if the advertiser has no recommendations available. On link failure after a successful audience-create, the error
        surfaces the underlying cause (e.g. 403 authz, upstream failure) and reports the orphan audience id so it can be reconciled
        out-of-band.
      operationId: CampaignsController_createRecommendedAudience_v1
      parameters:
      - name: id
        required: true
        in: path
        description: Campaign identifier.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecommendedAudienceDto'
      responses:
        '201':
          description: Created audience in envelope shape `{ data }`.
          content:
            application/json:
              example:
                data:
                  id: 1001
                  name: High-intent shoppers
                  totalUsers: 125000
                  createdAt: '2025-11-01T09:00:00.000Z'
                  geoLists:
                    include:
                    - 200
                    exclude: []
                  geo:
                    include:
                    - 237
                    exclude: []
                  updatedTime: '2025-11-02T12:00:00.000Z'
                  isTest: false
                  geoLocations:
                    include:
                    - id: 237
                      name: Los Angeles
                      geoType:
                        id: 4
                        name: Media Market
                    exclude: []
        default:
          description: Unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudienceSingleResponseDto_Output'
      summary: Create and link a recommended audience for a campaign
      tags:
      - campaigns
  /api/v1/campaigns/{id}/launch:
    post:
      description: 'Launches a campaign so it begins delivering.


        **Notes:** Only a campaign in a launchable state can be launched; an `incomplete` campaign is rejected with `422`
        before anything is sent upstream (it needs an active budget, a goal, an audience, installed pixels, and approved creatives).
        The launched campaign is returned so the caller can confirm the new status. If the campaign''s budget schedule already
        started (elapsed or in-flight budget periods will not be recovered), the launch proceeds without additional confirmation
        — calling this endpoint is the confirmation.'
      operationId: campaigns.launch
      parameters:
      - name: id
        required: true
        in: path
        description: Campaign (campaign group) ID.
        schema:
          type: string
      responses:
        '200':
          description: Launched campaign.
          content:
            application/json:
              example:
                data:
                  id: '501'
                  name: Spring prospecting
                  status: live
                  objective: PROSPECTING
                  totalBudget: 10000
                  monthlyBudget: 2500
                  spend: 1250.5
                  startTime: '2026-01-01T00:00:00.000Z'
                  endTime: '2026-03-31T23:59:59.000Z'
                  goalType: CPA
                  goalValue: 25
                  createdAt: '2025-12-01T10:00:00.000Z'
                  updatedAt: '2026-01-15T14:30:00.000Z'
                  snapshotUrl: https://c.mountain.com/storage/video/44821/poster/poster.jpg
                  videoPreview:

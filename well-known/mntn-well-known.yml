summary:
  documents_found: 0
  note: >-
    MNTN serves no /.well-known/ document of its own on any host. mountain.com and www.mountain.com
    404 on every path. auth.mountain.com and express.mountain.com are single-page apps whose catch-all
    route answers 200 with the app HTML shell for ANY /.well-known/* path -- these are soft-200s, not
    documents, and are recorded as misses. api.mountain.com and api3.mountain.com return the API
    gateway's 401 / RFC 9457 404 respectively. help.mountain.com serves a security.txt, but it is
    Intercom's (the help-desk vendor whose CNAME backs that subdomain), naming Intercom's own
    disclosure program -- it is not MNTN's document and earns MNTN no SecurityTxt pointer.
    No WellKnown or SecurityTxt pointer is wired in apis.yml as a result.
